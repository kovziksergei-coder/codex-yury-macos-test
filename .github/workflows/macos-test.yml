name: macOS validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-check:
    name: Clean macOS package check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          sw_vers
          uname -a
          uname -m

      - name: Validate shell syntax
        run: bash -n ./Connect-Codex-Yury-Kurilov.command

      - name: Run clean dry test
        run: |
          chmod +x ./Connect-Codex-Yury-Kurilov.command
          ./Connect-Codex-Yury-Kurilov.command --dry-run | tee macos-dry-run.log

      - name: Upload dry-run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-dry-run-${{ matrix.os }}
          path: macos-dry-run.log
          if-no-files-found: ignore

  full-router-test:
    name: Full router + Codex + Paseo test
    runs-on: macos-15
    timeout-minutes: 35
    env:
      KURILOV_API_KEY: ${{ secrets.KURILOV_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run full test when secret exists
        shell: bash
        run: |
          set -o pipefail
          if [[ -z "${KURILOV_API_KEY:-}" ]]; then
            echo "FULL TEST SKIPPED: repository secret KURILOV_API_KEY is not set." | tee macos-full-test.log
            exit 0
          fi
          chmod +x ./Connect-Codex-Yury-Kurilov.command
          KURILOV_CI=1 ./Connect-Codex-Yury-Kurilov.command 2>&1 | tee macos-full-test.log

      - name: Upload full-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-full-test
          path: macos-full-test.log
          if-no-files-found: ignore
